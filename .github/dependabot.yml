version: 2
updates:
  - package-ecosystem: "pip" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
      time: "13:49"
    open-pull-requests-limit: 7
    groups:
      dev-dependencies:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "patch"
    reviewers:
      - "Hemal-Botadra"
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "requirements.txt"
    schedule:
      interval: "daily"
      time: "13:16"
    ignore:
      - dependency-name: '*'

  - package-ecosystem: "pip" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
      time: "16:58"
    groups:
      dev-dependencies:
        applies-to: security-updates
        patterns:
          - "*"
    reviewers:
      - "Hemal-Botadra"
version: 2
updates:
  - package-ecosystem: "pip" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
      time: "14:11"
    groups:
      dev-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "Django"
    reviewers:
      - "Hemal-Botadra"
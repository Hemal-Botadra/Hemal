version: 2
updates:
  - package-ecosystem: "pip" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
      time: "14:02"
    open-pull-requests-limit: 0
    ignore:
      # For all packages, ignore all patch updates
      - dependency-name: "redis[hiredis]"
    reviewers:
      - "Hemal-Botadra"
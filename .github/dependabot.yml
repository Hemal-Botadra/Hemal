version: 2
updates:
  - package-ecosystem: "pip" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
      time: "13:51"
    open-pull-requests-limit: 7
    allow:
      # Allow only direct updates for
      # Django and any packages starting "django"
      - dependency-name: "all"
    reviewers:
      - "Hemal-Botadra"